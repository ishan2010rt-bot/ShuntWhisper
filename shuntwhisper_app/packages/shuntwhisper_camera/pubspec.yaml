name: shuntwhisper_camera
description: "Deterministic manual camera control and luma stream analysis for ShuntWhisper."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^17.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.shuntwhisper.camera
        pluginClass: ShuntCameraPlugin
      ios:
        pluginClass: ShuntCameraPlugin

