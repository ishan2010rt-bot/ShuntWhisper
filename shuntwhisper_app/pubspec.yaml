name: shuntwhisper_app
description: "ShuntWhisper: Smartphone-readable VP shunt occlusion diagnostic client."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.7.0
  get_it: ^7.7.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  shuntwhisper_camera:
    path: packages/shuntwhisper_camera

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/

